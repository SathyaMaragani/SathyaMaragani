<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 204" width="840" height="204">
  <style>
    .fade{animation:fade .9s ease-out both}
    .rise{animation:rise .8s cubic-bezier(.2,.75,.3,1) both}
    .grow{animation:grow 1.3s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:left center}
    .pop{animation:pop .7s cubic-bezier(.2,1.5,.5,1) both;transform-box:fill-box;transform-origin:center}
    .glow{animation:glow 4.5s ease-in-out infinite}
    .spin{animation:spin 11s linear infinite;transform-box:fill-box;transform-origin:center}
    .sway{animation:sway 9s ease-in-out infinite;transform-box:view-box}
    .float{animation:float 44s ease-in-out infinite}
    .twinkle{animation:twinkle 4s ease-in-out infinite}
    .blink{animation:blink 5s ease-in-out infinite}
    .shoot{animation:shoot 12s ease-in infinite;opacity:0}
    .sweep{animation:sweep 5s ease-in-out infinite}
    .beat{animation:beat 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes fade{from{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes pop{from{opacity:0;transform:scale(.72)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.8}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
    @keyframes float{0%,100%{transform:translateX(0)}50%{transform:translateX(15px)}}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.18}}
    @keyframes blink{0%,100%{opacity:1}42%{opacity:.12}}
    @keyframes shoot{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}13%{opacity:0;transform:translate(330px,175px)}100%{opacity:0;transform:translate(330px,175px)}}
    @keyframes sweep{0%,100%{opacity:.2}50%{opacity:.9}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="panelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F6B52" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E4034" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="840" height="204" fill="transparent"/>
  <g transform="translate(25,10)"><rect x="1" y="9" width="3.6" height="6" rx="1" fill="#34D399" opacity="0.55"/><rect x="6.2" y="5" width="3.6" height="10" rx="1" fill="#34D399" opacity="0.8"/><rect x="11.4" y="1.5" width="3.6" height="13.5" rx="1" fill="#34D399"/></g><text x="49" y="27" font-size="17" font-weight="700" fill="#EAF7F0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" class="fade">GitHub Stats</text><text x="815" y="26" text-anchor="end" font-size="10.5" fill="#6C8C7E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" class="fade" style="animation-delay:0.35s">33 sources &#183; 1 fork &#183; 0 archived &#183; 0 forks received</text><rect x="25" y="38" width="790" height="1" fill="#1E4034" class="grow" style="animation-delay:0.15s"/>

  <g class="rise" style="animation-delay:0.12s">
    <rect x="25" y="50" width="300" height="145" rx="12"
          fill="#0D211A" stroke="url(#panelEdge)" stroke-width="0.9"/>
    <text x="45" y="77" font-size="14" font-weight="700"
          fill="#EAF7F0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">SathyaMaragani</text>
    <rect x="40" y="90" width="270" height="1" fill="#1E4034"/>
    
      <g class="fade" style="animation-delay:0.30s">
        <text x="45" y="107" font-size="12.5" fill="#93B3A6"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Public Repositories</text>
        <text x="305" y="107" text-anchor="end" font-size="12.5"
              font-weight="700" fill="#E9C97E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">34</text>
      </g>
      <g class="fade" style="animation-delay:0.39s">
