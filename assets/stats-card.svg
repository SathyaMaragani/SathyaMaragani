              font-weight="700" fill="#E9C97E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">2</text>
      </g>
      <g class="fade" style="animation-delay:0.48s">
        <text x="45" y="151" font-size="12.5" fill="#93B3A6"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Followers</text>
        <text x="305" y="151" text-anchor="end" font-size="12.5"
              font-weight="700" fill="#E9C97E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0</text>
      </g>
      <g class="fade" style="animation-delay:0.57s">
        <text x="45" y="173" font-size="12.5" fill="#93B3A6"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Following</text>
        <text x="305" y="173" text-anchor="end" font-size="12.5"
              font-weight="700" fill="#E9C97E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0</text>
      </g>
  </g>

  <g class="rise" style="animation-delay:0.20s">
    <rect x="345" y="50" width="470" height="145" rx="12"
          fill="#0D211A" stroke="url(#panelEdge)" stroke-width="0.9"/>
    <text x="365" y="77" font-size="14" font-weight="700"
          fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Most Used Languages</text>
    <text x="795" y="77" text-anchor="end" font-size="10"
