      </g>
      <g class="fade" style="animation-delay:0.57s">
        <text x="365" y="172" font-size="12" fill="#93B3A6"
              font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Python</text>
        <rect x="463" y="163" width="276" height="11" rx="5.5"
