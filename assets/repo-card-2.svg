<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 88" width="380" height="88">
  <style>
    .fade{animation:fade .9s ease-out both}
    .rise{animation:rise .8s cubic-bezier(.2,.75,.3,1) both}
    .grow{animation:grow 1.3s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:left center}
    .draw{animation:draw 1.4s cubic-bezier(.25,.8,.3,1) both}
    .letter{animation:letter .75s ease-out both}
    .tick{animation:tick .34s linear both}
    .breathe{animation:breathe 6s ease-in-out infinite}
    .sheen{animation:sheen 6s ease-in-out infinite}
    .glow{animation:glow 4.5s ease-in-out infinite}
    .sway{animation:sway 9s ease-in-out infinite;transform-box:view-box}
    .float{animation:float 30s ease-in-out infinite}
    .twinkle{animation:twinkle 4s ease-in-out infinite}
    .blink{animation:blink 5s ease-in-out infinite}
    .shoot{animation:shoot 12s ease-in infinite;opacity:0}
    @keyframes fade{from{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes draw{from{stroke-dashoffset:var(--len,2000)}}
    @keyframes letter{from{fill-opacity:0}}
    @keyframes tick{0%{opacity:0}12%{opacity:1}86%{opacity:1}100%{opacity:0}}
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes sheen{0%{transform:translateX(0)}70%,100%{transform:translateX(420px)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.8}}
    @keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
    @keyframes float{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.18}}
    @keyframes blink{0%,100%{opacity:1}42%{opacity:.12}}
    @keyframes shoot{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}13%{opacity:0;transform:translate(330px,175px)}100%{opacity:0;transform:translate(330px,175px)}}
  </style>
  <defs>
    <linearGradient id="cardEdge2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E4034" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cardTop2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <g class="rise">
    <rect x="1" y="1" width="378" height="86" rx="12"
          fill="#0D211A" stroke="url(#cardEdge2)" stroke-width="0.9"/>
    <g class="breathe" style="animation-duration:8.2s;animation-delay:1.4s">
      <rect x="1" y="1" width="378" height="2.5" rx="1.25" fill="url(#cardTop2)"/>
    </g>

    <text x="18" y="32" font-size="15" font-weight="700" fill="#EAF7F0"
          font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">RPWeb</text>
    <rect x="318.0" y="17" width="44.0" height="19" rx="9.5"
          fill="#102A21" stroke="#1E4034" stroke-width="0.5"/>
    <text x="340.0" y="30" text-anchor="middle" font-size="9"
          fill="#6C8C7E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Public</text>

    
    <circle cx="23" cy="66" r="5" fill="#3178C6"/><text x="34" y="70" font-size="11" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">TypeScript</text>
    <g transform="translate(272,59)"><g transform="scale(0.5000)" fill="#E9C97E"><path d="m12.672.668 3.059 6.197 6.838.993a.75.75 0 0 1 .416 1.28l-4.948 4.823 1.168 6.812a.75.75 0 0 1-1.088.79L12 18.347l-6.116 3.216a.75.75 0 0 1-1.088-.791l1.168-6.811-4.948-4.823a.749.749 0 0 1 .416-1.279l6.838-.994L11.327.668a.75.75 0 0 1 1.345 0Z"/></g></g><text x="288" y="70" font-size="11" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0</text><g transform="translate(320,59)"><g transform="scale(0.5000)" fill="#6C8C7E"><path d="M8.75 19.25a3.25 3.25 0 1 1 6.5 0 3.25 3.25 0 0 1-6.5 0ZM15 4.75a3.25 3.25 0 1 1 6.5 0 3.25 3.25 0 0 1-6.5 0Zm-12.5 0a3.25 3.25 0 1 1 6.5 0 3.25 3.25 0 0 1-6.5 0ZM5.75 6.5a1.75 1.75 0 1 0-.001-3.501A1.75 1.75 0 0 0 5.75 6.5ZM12 21a1.75 1.75 0 1 0-.001-3.501A1.75 1.75 0 0 0 12 21Zm6.25-14.5a1.75 1.75 0 1 0-.001-3.501A1.75 1.75 0 0 0 18.25 6.5Z"/><path d="M6.5 7.75v1A2.25 2.25 0 0 0 8.75 11h6.5a2.25 2.25 0 0 0 2.25-2.25v-1H19v1a3.75 3.75 0 0 1-3.75 3.75h-6.5A3.75 3.75 0 0 1 5 8.75v-1Z"/><path d="M11.25 16.25v-5h1.5v5h-1.5Z"/></g></g><text x="336" y="70" font-size="11" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0</text>
    
  </g>
</svg>