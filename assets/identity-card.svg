<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 122" width="840" height="122">
  <style>
    .fade{animation:fade .9s ease-out both}
    .rise{animation:rise .8s cubic-bezier(.2,.75,.3,1) both}
    .grow{animation:grow 1.3s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:left center}
    .draw{animation:draw 1.4s cubic-bezier(.25,.8,.3,1) both}
    .letter{animation:letter .75s ease-out both}
    .tick{animation:tick .34s linear both}
    .breathe{animation:breathe 6s ease-in-out infinite}
    .sheen{animation:sheen 6s ease-in-out infinite}
    .glow{animation:glow 4.5s ease-in-out infinite}
    .sway{animation:sway 9s ease-in-out infinite;transform-box:view-box}
    .float{animation:float 30s ease-in-out infinite}
    .twinkle{animation:twinkle 4s ease-in-out infinite}
    .blink{animation:blink 5s ease-in-out infinite}
    .shoot{animation:shoot 12s ease-in infinite;opacity:0}
    @keyframes fade{from{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes draw{from{stroke-dashoffset:var(--len,2000)}}
    @keyframes letter{from{fill-opacity:0}}
    @keyframes tick{0%{opacity:0}12%{opacity:1}86%{opacity:1}100%{opacity:0}}
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes sheen{0%{transform:translateX(0)}70%,100%{transform:translateX(420px)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.8}}
    @keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
    @keyframes float{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.18}}
    @keyframes blink{0%,100%{opacity:1}42%{opacity:.12}}
    @keyframes shoot{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}13%{opacity:0;transform:translate(330px,175px)}100%{opacity:0;transform:translate(330px,175px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="idPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D211A"/>
      <stop offset="100%" stop-color="#0A1B15"/>
    </linearGradient>
    <linearGradient id="idEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F6B52" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E4034" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="840" height="122" fill="transparent"/>
  <g class="rise">
    <rect x="25" y="8" width="790" height="100" rx="14"
          fill="url(#idPanel)" stroke="url(#idEdge)" stroke-width="0.9"
           stroke-dasharray="1780" stroke-dashoffset="0" class="draw" style="--len:1780;animation-delay:0.15s"/>
    <g class="breathe" style="animation-duration:7s"><rect x="25" y="8" width="4"
          height="100" rx="2" fill="#E9C97E" opacity="0.9"/></g>
    <text x="50" y="46" font-size="23" font-weight="700" fill="#EAF7F0"
          font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Sathya Krishna Maragani<tspan dx="10" font-size="13" font-weight="400"
          fill="#6C8C7E">@SathyaMaragani</tspan></text>
    <text x="50" y="70" font-size="13" fill="#93B3A6"
          font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Developer • Builder • Explorer</text>
    <g transform="translate(50.0,92)" class="fade" style="animation-delay:0.30s"><g transform="translate(0,-10)"><g transform="scale(0.5417)" fill="#6C8C7E"><path d="M3 2.75A2.75 2.75 0 0 1 5.75 0h14.5a.75.75 0 0 1 .75.75v20.5a.75.75 0 0 1-.75.75h-6a.75.75 0 0 1 0-1.5h5.25v-4H6A1.5 1.5 0 0 0 4.5 18v.75c0 .716.43 1.334 1.05 1.605a.75.75 0 0 1-.6 1.374A3.251 3.251 0 0 1 3 18.75ZM19.5 1.5H5.75c-.69 0-1.25.56-1.25 1.25v12.651A2.989 2.989 0 0 1 6 15h13.5Z"/><path d="M7 18.25a.25.25 0 0 1 .25-.25h5a.25.25 0 0 1 .25.25v5.01a.25.25 0 0 1-.397.201l-2.206-1.604a.25.25 0 0 0-.294 0L7.397 23.46a.25.25 0 0 1-.397-.2v-5.01Z"/></g></g><text x="18" y="0" font-size="11.5" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">34 public repositories</text></g><g transform="translate(202.4,92)" class="fade" style="animation-delay:0.36s"><g transform="translate(0,-10)"><g transform="scale(0.5417)" fill="#6C8C7E"><path d="M12 .25a.75.75 0 0 1 .673.418l3.058 6.197 6.839.994a.75.75 0 0 1 .415 1.279l-4.948 4.823 1.168 6.811a.751.751 0 0 1-1.088.791L12 18.347l-6.117 3.216a.75.75 0 0 1-1.088-.79l1.168-6.812-4.948-4.823a.75.75 0 0 1 .416-1.28l6.838-.993L11.328.668A.75.75 0 0 1 12 .25Zm0 2.445L9.44 7.882a.75.75 0 0 1-.565.41l-5.725.832 4.143 4.038a.748.748 0 0 1 .215.664l-.978 5.702 5.121-2.692a.75.75 0 0 1 .698 0l5.12 2.692-.977-5.702a.748.748 0 0 1 .215-.664l4.143-4.038-5.725-.831a.75.75 0 0 1-.565-.41L12 2.694Z"/></g></g><text x="18" y="0" font-size="11.5" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">2 stars earned</text></g><g transform="translate(315.5,92)" class="fade" style="animation-delay:0.42s"><g transform="translate(0,-10)"><g transform="scale(0.5417)" fill="#6C8C7E"><path d="M6.75 0a.75.75 0 0 1 .75.75V3h9V.75a.75.75 0 0 1 1.5 0V3h2.75c.966 0 1.75.784 1.75 1.75v16a1.75 1.75 0 0 1-1.75 1.75H3.25a1.75 1.75 0 0 1-1.75-1.75v-16C1.5 3.784 2.284 3 3.25 3H6V.75A.75.75 0 0 1 6.75 0ZM21 9.5H3v11.25c0 .138.112.25.25.25h17.5a.25.25 0 0 0 .25-.25Zm-17.75-5a.25.25 0 0 0-.25.25V8h18V4.75a.25.25 0 0 0-.25-.25Z"/></g></g><text x="18" y="0" font-size="11.5" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Joined December 2021</text></g>
  </g>
</svg>