<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 122" width="380" height="122">
  <style>
    .fade{animation:fade .9s ease-out both}
    .rise{animation:rise .8s cubic-bezier(.2,.75,.3,1) both}
    .grow{animation:grow 1.3s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:left center}
    .pop{animation:pop .7s cubic-bezier(.2,1.5,.5,1) both;transform-box:fill-box;transform-origin:center}
    .glow{animation:glow 4.5s ease-in-out infinite}
    .spin{animation:spin 11s linear infinite;transform-box:fill-box;transform-origin:center}
    .sway{animation:sway 9s ease-in-out infinite;transform-box:view-box}
    .float{animation:float 44s ease-in-out infinite}
    .twinkle{animation:twinkle 4s ease-in-out infinite}
    .blink{animation:blink 5s ease-in-out infinite}
    .shoot{animation:shoot 12s ease-in infinite;opacity:0}
    .sweep{animation:sweep 5s ease-in-out infinite}
    .beat{animation:beat 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes fade{from{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes pop{from{opacity:0;transform:scale(.72)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.8}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
    @keyframes float{0%,100%{transform:translateX(0)}50%{transform:translateX(15px)}}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.18}}
    @keyframes blink{0%,100%{opacity:1}42%{opacity:.12}}
    @keyframes shoot{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}13%{opacity:0;transform:translate(330px,175px)}100%{opacity:0;transform:translate(330px,175px)}}
    @keyframes sweep{0%,100%{opacity:.2}50%{opacity:.9}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="cardEdge3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E4034" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cardTop3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#86EFAC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <g class="rise">
    <rect x="1" y="1" width="378" height="120" rx="12"
          fill="#0D211A" stroke="url(#cardEdge3)" stroke-width="0.9"/>
    <rect x="1" y="1" width="378" height="2.5" rx="1.25" fill="url(#cardTop3)"
          class="sweep"/>

    <text x="18" y="32" font-size="15" font-weight="700" fill="#EAF7F0"
          font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">RPWeb</text>
    <rect x="318.0" y="17" width="44.0" height="19" rx="9.5"
          fill="#102A21" stroke="#1E4034" stroke-width="0.5"/>
    <text x="340.0" y="30" text-anchor="middle" font-size="9"
          fill="#6C8C7E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Public</text>

    <text x="18" y="56" font-size="12" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" class="fade" style="animation-delay:0.20s">No description provided</text>
    <circle cx="23" cy="100" r="5" fill="#3178C6" class="beat"/><text x="34" y="104" font-size="11" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">TypeScript</text>
    <path transform="translate(272,93) scale(0.55)" fill="#E9C97E" d="M10 0 L12.9 6.5 L20 7.3 L14.7 12.1 L16.2 19.2 L10 15.6 L3.8 19.2 L5.3 12.1 L0 7.3 L7.1 6.5 Z"/><text x="286" y="104" font-size="11" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0</text><g transform="translate(320,94)" stroke="#6C8C7E" fill="#6C8C7E" stroke-width="1.2"><circle cx="1.5" cy="1.5" r="1.5" stroke="none"/><circle cx="9.5" cy="1.5" r="1.5" stroke="none"/><circle cx="5.5" cy="10" r="1.5" stroke="none"/><path d="M1.5 3 v1.5 a2 2 0 0 0 2 2 h4 a2 2 0 0 0 2 -2 V3" fill="none"/><path d="M5.5 6.5 v2" fill="none"/></g><text x="336" y="104" font-size="11" fill="#93B3A6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0</text>
    
  </g>
</svg>